<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">From reward modeling to calibrated decisions</title>
  <desc id="desc">A four-stage lineage from scalar reward through pairwise preference and multiway choice to calibrated decisions, ending in the Jev typed decision API.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <linearGradient id="jev" x1="0" x2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#f8fafc"/>
  <circle cx="1470" cy="80" r="210" fill="#dbeafe" opacity="0.55"/>
  <circle cx="80" cy="880" r="250" fill="#ccfbf1" opacity="0.45"/>

  <text x="80" y="86" fill="#0f172a" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="700">From reward modeling to calibrated decisions</text>
  <text x="82" y="132" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26">The learned object changes at every stage</text>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g filter="url(#shadow)">
      <rect x="70" y="224" width="330" height="420" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="70" y="224" width="330" height="12" rx="6" fill="#64748b"/>
    </g>
    <text x="102" y="288" fill="#64748b" font-size="22" font-weight="700" letter-spacing="2">ORM / PRM</text>
    <text x="102" y="338" fill="#0f172a" font-size="34" font-weight="700">Scalar reward</text>
    <line x1="102" y1="372" x2="368" y2="372" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="235" cy="448" r="55" fill="#f1f5f9" stroke="#94a3b8" stroke-width="3"/>
    <text x="235" y="462" fill="#0f172a" font-size="38" font-family="Georgia, serif" font-style="italic" text-anchor="middle">rθ</text>
    <text x="235" y="548" fill="#0f172a" font-size="30" font-family="Georgia, serif" text-anchor="middle">rθ(x, a) ∈ ℝ</text>
    <text x="235" y="596" fill="#64748b" font-size="23" text-anchor="middle">absolute-looking score</text>

    <g filter="url(#shadow)">
      <rect x="450" y="224" width="330" height="420" rx="26" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
      <rect x="450" y="224" width="330" height="12" rx="6" fill="#2563eb"/>
    </g>
    <text x="482" y="288" fill="#2563eb" font-size="22" font-weight="700" letter-spacing="2">PPRM / BT</text>
    <text x="482" y="338" fill="#0f172a" font-size="34" font-weight="700">Pairwise preference</text>
    <line x1="482" y1="372" x2="748" y2="372" stroke="#dbeafe" stroke-width="2"/>
    <circle cx="560" cy="446" r="43" fill="#dbeafe"/>
    <circle cx="670" cy="446" r="43" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/>
    <text x="560" y="458" fill="#1e3a8a" font-size="32" font-weight="700" text-anchor="middle">A</text>
    <text x="670" y="458" fill="#1e3a8a" font-size="32" font-weight="700" text-anchor="middle">B</text>
    <path d="M 606 430 C 626 408, 642 408, 660 426" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="615" y="548" fill="#0f172a" font-size="30" font-family="Georgia, serif" text-anchor="middle">P(A ≻ B | x)</text>
    <text x="615" y="596" fill="#64748b" font-size="23" text-anchor="middle">two candidates</text>

    <g filter="url(#shadow)">
      <rect x="830" y="224" width="330" height="420" rx="26" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/>
      <rect x="830" y="224" width="330" height="12" rx="6" fill="#7c3aed"/>
    </g>
    <text x="862" y="288" fill="#7c3aed" font-size="22" font-weight="700" letter-spacing="2">LUCE / PL</text>
    <text x="862" y="338" fill="#0f172a" font-size="34" font-weight="700">Multiway choice</text>
    <line x1="862" y1="372" x2="1128" y2="372" stroke="#ede9fe" stroke-width="2"/>
    <rect x="877" y="410" width="236" height="72" rx="18" fill="#f5f3ff"/>
    <rect x="877" y="410" width="91" height="72" rx="18" fill="#7c3aed"/>
    <rect x="968" y="410" width="61" height="72" fill="#a78bfa"/>
    <rect x="1029" y="410" width="47" height="72" fill="#c4b5fd"/>
    <rect x="1076" y="410" width="37" height="72" rx="18" fill="#ddd6fe"/>
    <text x="923" y="455" fill="#ffffff" font-size="24" font-weight="700" text-anchor="middle">p₁</text>
    <text x="998" y="455" fill="#ffffff" font-size="24" font-weight="700" text-anchor="middle">p₂</text>
    <text x="1052" y="455" fill="#5b21b6" font-size="24" font-weight="700" text-anchor="middle">p₃</text>
    <text x="1095" y="455" fill="#5b21b6" font-size="22" font-weight="700" text-anchor="middle">pₖ</text>
    <text x="995" y="548" fill="#0f172a" font-size="30" font-family="Georgia, serif" text-anchor="middle">P(aᵢ | x, A)</text>
    <text x="995" y="596" fill="#64748b" font-size="23" text-anchor="middle">K candidates</text>

    <g filter="url(#shadow)">
      <rect x="1210" y="224" width="320" height="420" rx="26" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
      <rect x="1210" y="224" width="320" height="12" rx="6" fill="#0f766e"/>
    </g>
    <text x="1242" y="288" fill="#0f766e" font-size="22" font-weight="700" letter-spacing="2">RLCD</text>
    <text x="1242" y="338" fill="#0f172a" font-size="34" font-weight="700">Calibrated decision</text>
    <line x1="1242" y1="372" x2="1498" y2="372" stroke="#ccfbf1" stroke-width="2"/>
    <circle cx="1370" cy="447" r="70" fill="#f0fdfa" stroke="#14b8a6" stroke-width="3"/>
    <circle cx="1370" cy="447" r="43" fill="none" stroke="#2dd4bf" stroke-width="3"/>
    <circle cx="1370" cy="447" r="15" fill="#0f766e"/>
    <path d="M 1320 472 L 1354 447 L 1368 459 L 1420 408" fill="none" stroke="#0f766e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1370" y="548" fill="#0f172a" font-size="28" font-family="Georgia, serif" text-anchor="middle">P(correct | p) ≈ p</text>
    <text x="1370" y="596" fill="#64748b" font-size="23" text-anchor="middle">operational uncertainty</text>

    <line x1="404" y1="438" x2="438" y2="438" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="784" y1="438" x2="818" y2="438" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="1164" y1="438" x2="1198" y2="438" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="80" y="724" width="1440" height="112" rx="28" fill="url(#jev)"/>
    <text x="120" y="772" fill="#bfdbfe" font-size="24" font-weight="700" letter-spacing="3">Jev</text>
    <text x="120" y="814" fill="#ffffff" font-size="32" font-weight="700">State + schema → typed probabilities, served directly to software</text>
    <text x="1472" y="792" fill="#ffffff" font-size="56" font-weight="700" text-anchor="end">API</text>
  </g>
</svg>
