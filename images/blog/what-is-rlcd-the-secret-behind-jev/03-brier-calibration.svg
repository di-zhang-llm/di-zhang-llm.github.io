<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">The Brier score prices confidence</title>
  <desc id="desc">Three panels show the squared penalty for a binary 0.8 forecast, the reliability minus resolution plus uncertainty decomposition, and the RLCD calibration loop from outcomes to policy.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <linearGradient id="confidence" x1="0" x2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="0.8" stop-color="#2563eb"/>
      <stop offset="0.8" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="920" fill="#f8fafc"/>
  <circle cx="1530" cy="45" r="245" fill="#ede9fe" opacity="0.58"/>
  <circle cx="45" cy="890" r="210" fill="#ccfbf1" opacity="0.54"/>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="80" y="82" fill="#0f172a" font-size="52" font-weight="700">The Brier score prices confidence</text>
    <text x="82" y="128" fill="#475569" font-size="26">It scores the probability itself—not only whether the top choice won.</text>

    <g filter="url(#shadow)">
      <rect x="72" y="188" width="456" height="646" rx="28" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
      <rect x="572" y="188" width="456" height="646" rx="28" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/>
      <rect x="1072" y="188" width="456" height="646" rx="28" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
    </g>

    <rect x="72" y="188" width="456" height="8" rx="4" fill="#2563eb"/>
    <text x="112" y="246" fill="#2563eb" font-size="18" font-weight="700" letter-spacing="2">BINARY NOUL</text>
    <text x="112" y="288" fill="#0f172a" font-size="31" font-weight="700">Confidence has a price</text>
    <text x="112" y="326" fill="#64748b" font-size="21">Forecast: P(Y = 1) = 0.80</text>

    <rect x="112" y="354" width="376" height="24" rx="12" fill="url(#confidence)"/>
    <circle cx="413" cy="366" r="13" fill="#ffffff" stroke="#2563eb" stroke-width="5"/>
    <text x="413" y="411" fill="#2563eb" font-size="22" font-weight="700" text-anchor="middle">0.80</text>

    <rect x="112" y="452" width="376" height="112" rx="20" fill="#f0fdfa"/>
    <text x="138" y="489" fill="#0f766e" font-size="20" font-weight="700">EVENT OCCURS · y = 1</text>
    <text x="138" y="535" fill="#0f172a" font-size="29" font-weight="700">(0.8 − 1)² = 0.04</text>

    <rect x="112" y="588" width="376" height="112" rx="20" fill="#fff1f2"/>
    <text x="138" y="625" fill="#be123c" font-size="20" font-weight="700">EVENT FAILS · y = 0</text>
    <text x="138" y="671" fill="#0f172a" font-size="29" font-weight="700">(0.8 − 0)² = 0.64</text>

    <rect x="112" y="734" width="376" height="58" rx="18" fill="#eff6ff"/>
    <text x="300" y="771" fill="#1d4ed8" font-size="22" font-weight="700" text-anchor="middle">Wrong confidence costs 16× more</text>

    <rect x="572" y="188" width="456" height="8" rx="4" fill="#7c3aed"/>
    <text x="612" y="246" fill="#7c3aed" font-size="18" font-weight="700" letter-spacing="2">DIAGNOSIS</text>
    <text x="612" y="288" fill="#0f172a" font-size="31" font-weight="700">Brier decomposes</text>
    <text x="612" y="326" fill="#64748b" font-size="21">Mean score over observed outcomes</text>

    <rect x="612" y="354" width="376" height="76" rx="20" fill="#f5f3ff"/>
    <text x="800" y="402" fill="#5b21b6" font-size="28" font-weight="700" text-anchor="middle">BS = REL − RES + UNC</text>

    <circle cx="644" cy="482" r="17" fill="#7c3aed"/>
    <text x="679" y="474" fill="#0f172a" font-size="23" font-weight="700">Reliability ↓</text>
    <text x="679" y="504" fill="#64748b" font-size="19">probability–frequency gap</text>
    <line x1="630" y1="534" x2="970" y2="534" stroke="#e2e8f0" stroke-width="2"/>

    <path d="M 632 604 L 644 590 L 656 604" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="679" y="582" fill="#0f172a" font-size="23" font-weight="700">Resolution ↑</text>
    <text x="679" y="612" fill="#64748b" font-size="19">separates easy and hard cases</text>
    <line x1="630" y1="642" x2="970" y2="642" stroke="#e2e8f0" stroke-width="2"/>

    <circle cx="644" cy="700" r="17" fill="#94a3b8"/>
    <path d="M 635 700 H 653" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <text x="679" y="692" fill="#0f172a" font-size="23" font-weight="700">Uncertainty</text>
    <text x="679" y="722" fill="#64748b" font-size="19">fixed base-rate difficulty</text>

    <text x="800" y="782" fill="#6d28d9" font-size="20" font-weight="700" text-anchor="middle">Low score = calibrated and discriminating</text>

    <rect x="1072" y="188" width="456" height="8" rx="4" fill="#0f766e"/>
    <text x="1112" y="246" fill="#0f766e" font-size="18" font-weight="700" letter-spacing="2">RLCD LOOP</text>
    <text x="1112" y="288" fill="#0f172a" font-size="31" font-weight="700">Calibrate, then act</text>
    <text x="1112" y="326" fill="#64748b" font-size="21">Turn outcomes into a policy</text>

    <circle cx="1142" cy="392" r="24" fill="#0f766e"/>
    <text x="1142" y="400" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">1</text>
    <text x="1184" y="384" fill="#0f172a" font-size="23" font-weight="700">Log outcomes</text>
    <text x="1184" y="413" fill="#64748b" font-size="19">decision, probability, result</text>
    <path d="M 1142 422 V 452" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

    <circle cx="1142" cy="486" r="24" fill="#0f766e"/>
    <text x="1142" y="494" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">2</text>
    <text x="1184" y="478" fill="#0f172a" font-size="23" font-weight="700">Measure Brier</text>
    <text x="1184" y="507" fill="#64748b" font-size="19">plus reliability and resolution</text>
    <path d="M 1142 516 V 546" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

    <circle cx="1142" cy="580" r="24" fill="#0f766e"/>
    <text x="1142" y="588" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">3</text>
    <text x="1184" y="572" fill="#0f172a" font-size="23" font-weight="700">Fit calibration</text>
    <text x="1184" y="601" fill="#64748b" font-size="19">temperature or another map</text>
    <path d="M 1142 610 V 640" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

    <circle cx="1142" cy="674" r="24" fill="#0f766e"/>
    <text x="1142" y="682" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">4</text>
    <text x="1184" y="666" fill="#0f172a" font-size="23" font-weight="700">Set policy thresholds</text>
    <text x="1184" y="695" fill="#64748b" font-size="19">gather · escalate · execute</text>

    <rect x="1112" y="744" width="376" height="48" rx="16" fill="#f0fdfa"/>
    <text x="1300" y="775" fill="#0f766e" font-size="20" font-weight="700" text-anchor="middle">Re-estimate as production shifts</text>

    <text x="800" y="882" fill="#64748b" font-size="20" text-anchor="middle">Same top-1 choice, different probability quality—and therefore a different automation decision.</text>
  </g>
</svg>
