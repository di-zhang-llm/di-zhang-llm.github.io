<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">Calibration turns confidence into a control signal</title>
  <desc id="desc">A conceptual reliability diagram maps predicted probability to observed frequency, followed by a policy flow that uses calibrated confidence to gather context, escalate, or execute.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <linearGradient id="confidence" x1="0" x2="1">
      <stop offset="0" stop-color="#cbd5e1"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="920" fill="#f8fafc"/>
  <circle cx="1535" cy="50" r="250" fill="#ccfbf1" opacity="0.5"/>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="80" y="82" fill="#0f172a" font-size="52" font-weight="700">Calibration turns confidence into a control signal</text>
    <text x="82" y="128" fill="#475569" font-size="26">Ranking chooses an action. Calibration decides whether software should trust it.</text>

    <g filter="url(#shadow)">
      <rect x="72" y="190" width="850" height="620" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    </g>
    <text x="112" y="252" fill="#0f172a" font-size="33" font-weight="700">Reliability diagram</text>
    <text x="112" y="288" fill="#64748b" font-size="22">Probability should match empirical frequency</text>

    <rect x="190" y="340" width="590" height="360" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <g stroke="#e2e8f0" stroke-width="2">
      <line x1="190" y1="610" x2="780" y2="610"/>
      <line x1="190" y1="520" x2="780" y2="520"/>
      <line x1="190" y1="430" x2="780" y2="430"/>
      <line x1="337" y1="340" x2="337" y2="700"/>
      <line x1="485" y1="340" x2="485" y2="700"/>
      <line x1="632" y1="340" x2="632" y2="700"/>
    </g>
    <line x1="190" y1="700" x2="780" y2="340" stroke="#0f766e" stroke-width="6"/>
    <path d="M 190 700 C 310 685, 370 620, 470 565 C 560 515, 630 430, 780 392" fill="none" stroke="#7c3aed" stroke-width="7" stroke-linecap="round"/>
    <g fill="#7c3aed">
      <circle cx="278" cy="662" r="9"/>
      <circle cx="395" cy="606" r="9"/>
      <circle cx="515" cy="538" r="9"/>
      <circle cx="644" cy="442" r="9"/>
      <circle cx="742" cy="402" r="9"/>
    </g>
    <line x1="580" y1="515" x2="647" y2="459" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="526" y="522" width="194" height="48" rx="24" fill="#f5f3ff"/>
    <text x="623" y="553" fill="#6d28d9" font-size="20" font-weight="700" text-anchor="middle">calibrate</text>

    <text x="485" y="756" fill="#334155" font-size="23" font-weight="700" text-anchor="middle">Predicted probability</text>
    <text x="126" y="528" fill="#334155" font-size="23" font-weight="700" text-anchor="middle" transform="rotate(-90 126 528)">Observed frequency</text>
    <text x="184" y="730" fill="#64748b" font-size="20" text-anchor="middle">0</text>
    <text x="783" y="730" fill="#64748b" font-size="20" text-anchor="middle">1</text>
    <text x="164" y="706" fill="#64748b" font-size="20" text-anchor="end">0</text>
    <text x="164" y="348" fill="#64748b" font-size="20" text-anchor="end">1</text>
    <line x1="712" y1="332" x2="753" y2="332" stroke="#0f766e" stroke-width="6"/>
    <text x="760" y="339" fill="#0f766e" font-size="20">calibrated</text>
    <line x1="712" y1="372" x2="753" y2="372" stroke="#7c3aed" stroke-width="6"/>
    <text x="760" y="379" fill="#7c3aed" font-size="20">uncalibrated</text>
    <text x="112" y="779" fill="#64748b" font-size="19" font-style="italic">Conceptual illustration — not a Jev benchmark</text>

    <g filter="url(#shadow)">
      <rect x="970" y="190" width="558" height="620" rx="28" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
    </g>
    <text x="1010" y="252" fill="#0f172a" font-size="33" font-weight="700">Decision policy</text>
    <text x="1010" y="288" fill="#64748b" font-size="22">Thresholds depend on cost and risk</text>

    <rect x="1010" y="337" width="478" height="24" rx="12" fill="url(#confidence)"/>
    <text x="1010" y="397" fill="#64748b" font-size="20">less confidence</text>
    <text x="1488" y="397" fill="#64748b" font-size="20" text-anchor="end">more confidence</text>

    <rect x="1010" y="438" width="478" height="84" rx="20" fill="#f1f5f9"/>
    <circle cx="1056" cy="480" r="20" fill="#94a3b8"/>
    <text x="1056" y="487" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">1</text>
    <text x="1092" y="470" fill="#0f172a" font-size="25" font-weight="700">Gather more context</text>
    <text x="1092" y="500" fill="#64748b" font-size="20">Improve the state before deciding</text>

    <rect x="1010" y="548" width="478" height="84" rx="20" fill="#fffbeb"/>
    <circle cx="1056" cy="590" r="20" fill="#d97706"/>
    <text x="1056" y="597" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">2</text>
    <text x="1092" y="580" fill="#0f172a" font-size="25" font-weight="700">Escalate</text>
    <text x="1092" y="610" fill="#92400e" font-size="20">Send costly or ambiguous cases to review</text>

    <rect x="1010" y="658" width="478" height="84" rx="20" fill="#f0fdfa"/>
    <circle cx="1056" cy="700" r="20" fill="#0f766e"/>
    <text x="1056" y="707" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">3</text>
    <text x="1092" y="690" fill="#0f172a" font-size="25" font-weight="700">Execute</text>
    <text x="1092" y="720" fill="#0f766e" font-size="20">Act when confidence clears the policy bar</text>

    <path d="M 1249 410 V 428" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="1249" y="786" fill="#0f766e" font-size="21" font-weight="700" text-anchor="middle">Same probability, different policy by application</text>
  </g>
</svg>
