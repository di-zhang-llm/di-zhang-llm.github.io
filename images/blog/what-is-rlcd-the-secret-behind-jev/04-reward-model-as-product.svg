<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">The reward model becomes the product</title>
  <desc id="desc">A comparison between a conventional RLHF stack, where the reward model trains a text generator, and the Jev stack, where the evaluator directly serves typed probability distributions.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <linearGradient id="jev" x1="0" x2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="940" fill="#f8fafc"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="80" y="82" fill="#0f172a" font-size="52" font-weight="700">The reward model becomes the product</text>
    <text x="82" y="128" fill="#475569" font-size="26">Jev turns an internal evaluator into the runtime interface</text>

    <g filter="url(#shadow)">
      <rect x="70" y="190" width="650" height="625" rx="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    </g>
    <text x="112" y="252" fill="#64748b" font-size="22" font-weight="700" letter-spacing="2">CONVENTIONAL RLHF STACK</text>
    <text x="112" y="300" fill="#0f172a" font-size="34" font-weight="700">The reward model stays backstage</text>

    <rect x="130" y="358" width="200" height="84" rx="22" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <text x="230" y="410" fill="#0f172a" font-size="28" font-weight="700" text-anchor="middle">Prompt</text>
    <line x1="330" y1="400" x2="380" y2="400" stroke="#64748b" stroke-width="4" marker-end="url(#arrow-gray)"/>

    <rect x="396" y="358" width="238" height="84" rx="22" fill="#e2e8f0"/>
    <text x="515" y="392" fill="#0f172a" font-size="24" font-weight="700" text-anchor="middle">Generator</text>
    <text x="515" y="423" fill="#475569" font-size="20" text-anchor="middle">autoregressive policy</text>

    <line x1="515" y1="442" x2="515" y2="502" stroke="#64748b" stroke-width="4" marker-end="url(#arrow-gray)"/>
    <rect x="396" y="518" width="238" height="84" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="515" y="552" fill="#0f172a" font-size="24" font-weight="700" text-anchor="middle">Generated text</text>
    <text x="515" y="583" fill="#64748b" font-size="20" text-anchor="middle">free-form output</text>

    <rect x="130" y="518" width="200" height="84" rx="22" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" stroke-dasharray="10 8"/>
    <text x="230" y="552" fill="#92400e" font-size="23" font-weight="700" text-anchor="middle">Reward model</text>
    <text x="230" y="583" fill="#b45309" font-size="19" text-anchor="middle">training-time judge</text>
    <path d="M 396 560 H 344" stroke="#d97706" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#arrow-gray)"/>
    <path d="M 230 518 V 476 C 230 455 250 452 286 452 H 390" fill="none" stroke="#d97706" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#arrow-gray)"/>
    <text x="246" y="488" fill="#b45309" font-size="18">optimize policy</text>

    <rect x="130" y="674" width="504" height="82" rx="22" fill="#f1f5f9"/>
    <text x="382" y="708" fill="#0f172a" font-size="24" font-weight="700" text-anchor="middle">Product surface</text>
    <text x="382" y="738" fill="#475569" font-size="21" text-anchor="middle">generated string → parser → application action</text>

    <g filter="url(#shadow)">
      <rect x="880" y="190" width="650" height="625" rx="30" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    </g>
    <text x="922" y="252" fill="#2563eb" font-size="22" font-weight="700" letter-spacing="2">JEV · RLCD STACK</text>
    <text x="922" y="300" fill="#0f172a" font-size="34" font-weight="700">The evaluator becomes the interface</text>

    <rect x="930" y="358" width="206" height="84" rx="22" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <text x="1033" y="392" fill="#1e3a8a" font-size="24" font-weight="700" text-anchor="middle">State + schema</text>
    <text x="1033" y="423" fill="#2563eb" font-size="20" text-anchor="middle">known output space</text>
    <line x1="1136" y1="400" x2="1182" y2="400" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>

    <rect x="1198" y="340" width="280" height="120" rx="24" fill="url(#jev)"/>
    <text x="1338" y="376" fill="#dbeafe" font-size="21" font-weight="700" text-anchor="middle">DECISION MODEL</text>
    <text x="1338" y="411" fill="#ffffff" font-size="23" font-weight="700" text-anchor="middle">utility → normalize</text>
    <text x="1338" y="441" fill="#ffffff" font-size="23" font-weight="700" text-anchor="middle">→ calibrate</text>

    <line x1="1338" y1="460" x2="1338" y2="508" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <rect x="922" y="524" width="170" height="92" rx="22" fill="#eff6ff"/>
    <rect x="1120" y="524" width="170" height="92" rx="22" fill="#f5f3ff"/>
    <rect x="1318" y="524" width="170" height="92" rx="22" fill="#f0fdfa"/>
    <text x="1007" y="562" fill="#1e40af" font-size="25" font-weight="700" text-anchor="middle">Noul</text>
    <text x="1007" y="592" fill="#2563eb" font-size="19" text-anchor="middle">binary probability</text>
    <text x="1205" y="562" fill="#6d28d9" font-size="25" font-weight="700" text-anchor="middle">Choice</text>
    <text x="1205" y="592" fill="#7c3aed" font-size="19" text-anchor="middle">K-way distribution</text>
    <text x="1403" y="562" fill="#0f766e" font-size="25" font-weight="700" text-anchor="middle">Score</text>
    <text x="1403" y="592" fill="#0f766e" font-size="19" text-anchor="middle">ordered levels</text>

    <path d="M 1338 508 H 1007 V 514" fill="none" stroke="#93c5fd" stroke-width="3"/>
    <path d="M 1338 508 H 1205 V 514" fill="none" stroke="#a78bfa" stroke-width="3"/>
    <path d="M 1338 508 H 1403 V 514" fill="none" stroke="#2dd4bf" stroke-width="3"/>

    <rect x="922" y="674" width="566" height="82" rx="22" fill="#ecfeff"/>
    <text x="1205" y="708" fill="#0f172a" font-size="24" font-weight="700" text-anchor="middle">Product surface</text>
    <text x="1205" y="738" fill="#0f766e" font-size="21" text-anchor="middle">typed probabilities → direct program branch</text>

    <circle cx="800" cy="492" r="56" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 774 492 H 825" stroke="#64748b" stroke-width="5" marker-end="url(#arrow-gray)"/>
    <text x="800" y="576" fill="#64748b" font-size="18" font-weight="700" text-anchor="middle">TURN THE</text>
    <text x="800" y="601" fill="#64748b" font-size="18" font-weight="700" text-anchor="middle">EVALUATOR OUTWARD</text>

    <rect x="310" y="854" width="980" height="58" rx="29" fill="#0f172a"/>
    <text x="800" y="892" fill="#ffffff" font-size="27" font-weight="700" text-anchor="middle">The model that once scored the answer now returns the answer</text>
  </g>
</svg>
