<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">The decision head turns representations into utilities</title>
  <desc id="desc">State, question, and candidate representations are pooled and projected into a rank-512 interaction space. Query-key dot products produce candidate utilities, and softmax converts them into a typed probability distribution.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <linearGradient id="takeaway" x1="0" x2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="0.52" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="probability" x1="0" x2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="920" fill="#f8fafc"/>
  <circle cx="1510" cy="75" r="220" fill="#ccfbf1" opacity="0.46"/>
  <circle cx="45" cy="900" r="230" fill="#dbeafe" opacity="0.50"/>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="76" y="78" fill="#0f172a" font-size="50" font-weight="750">The decision head produces candidate utilities</text>
    <text x="78" y="122" fill="#475569" font-size="24">pooled representations → rank-512 interaction → calibrated distribution</text>

    <g filter="url(#shadow)">
      <rect x="60" y="170" width="470" height="620" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="565" y="170" width="470" height="620" rx="28" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/>
      <rect x="1070" y="170" width="470" height="620" rx="28" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
    </g>

    <rect x="60" y="170" width="470" height="8" rx="4" fill="#2563eb"/>
    <text x="96" y="226" fill="#2563eb" font-size="18" font-weight="750" letter-spacing="1.8">1 · ENCODE AND POOL</text>
    <text x="96" y="266" fill="#0f172a" font-size="30" font-weight="700">Three contextual spans</text>
    <text x="96" y="300" fill="#64748b" font-size="20">One tree-masked encoder pass</text>

    <rect x="98" y="345" width="188" height="92" rx="22" fill="#eff6ff" stroke="#60a5fa" stroke-width="2.5"/>
    <text x="192" y="378" fill="#1e40af" font-size="18" font-weight="700" text-anchor="middle">STATE</text>
    <text x="192" y="414" fill="#1e3a8a" font-size="30" font-family="Georgia, serif" font-style="italic" text-anchor="middle">h̄S</text>

    <rect x="304" y="345" width="188" height="92" rx="22" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2.5"/>
    <text x="398" y="378" fill="#6d28d9" font-size="18" font-weight="700" text-anchor="middle">QUESTION f</text>
    <text x="398" y="414" fill="#5b21b6" font-size="30" font-family="Georgia, serif" font-style="italic" text-anchor="middle">h̄Qf</text>

    <text x="96" y="492" fill="#64748b" font-size="18" font-weight="750" letter-spacing="1.4">RUNTIME CANDIDATES</text>
    <rect x="98" y="520" width="118" height="76" rx="19" fill="#f0fdfa" stroke="#5eead4" stroke-width="2.5"/>
    <rect x="236" y="520" width="118" height="76" rx="19" fill="#f0fdfa" stroke="#5eead4" stroke-width="2.5"/>
    <rect x="374" y="520" width="118" height="76" rx="19" fill="#f0fdfa" stroke="#5eead4" stroke-width="2.5"/>
    <text x="157" y="551" fill="#0f766e" font-size="17" font-weight="700" text-anchor="middle">CANDIDATE 1</text>
    <text x="157" y="578" fill="#115e59" font-size="25" font-family="Georgia, serif" font-style="italic" text-anchor="middle">h̄C₁</text>
    <text x="295" y="551" fill="#0f766e" font-size="17" font-weight="700" text-anchor="middle">CANDIDATE 2</text>
    <text x="295" y="578" fill="#115e59" font-size="25" font-family="Georgia, serif" font-style="italic" text-anchor="middle">h̄C₂</text>
    <text x="433" y="551" fill="#0f766e" font-size="17" font-weight="700" text-anchor="middle">CANDIDATE K</text>
    <text x="433" y="578" fill="#115e59" font-size="25" font-family="Georgia, serif" font-style="italic" text-anchor="middle">h̄Cₖ</text>

    <rect x="98" y="650" width="394" height="94" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <text x="295" y="686" fill="#334155" font-size="21" font-weight="700" text-anchor="middle">Mean pooling after LayerNorm</text>
    <text x="295" y="718" fill="#64748b" font-size="19" text-anchor="middle">text and image tokens share the state span</text>

    <rect x="565" y="170" width="470" height="8" rx="4" fill="#7c3aed"/>
    <text x="601" y="226" fill="#7c3aed" font-size="18" font-weight="750" letter-spacing="1.8">2 · INTERACT IN RANK 512</text>
    <text x="601" y="266" fill="#0f172a" font-size="30" font-weight="700">Query meets candidate keys</text>
    <text x="601" y="300" fill="#64748b" font-size="20">Shared parameters across every schema</text>

    <path d="M 530 390 H 600" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <path d="M 530 557 H 600" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow-teal)"/>

    <rect x="610" y="340" width="380" height="116" rx="24" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2.5"/>
    <text x="800" y="375" fill="#4338ca" font-size="18" font-weight="750" text-anchor="middle">QUERY</text>
    <text x="800" y="418" fill="#312e81" font-size="29" font-family="Georgia, serif" font-style="italic" text-anchor="middle">qf = Wq h̄S + Wq h̄Qf</text>

    <rect x="610" y="505" width="380" height="106" rx="24" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2.5"/>
    <text x="800" y="540" fill="#047857" font-size="18" font-weight="750" text-anchor="middle">CANDIDATE KEYS</text>
    <text x="800" y="582" fill="#065f46" font-size="29" font-family="Georgia, serif" font-style="italic" text-anchor="middle">kf,i = Wk h̄Cf,i</text>

    <path d="M 800 456 V 480" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M 800 611 V 636" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="626" y="650" width="348" height="94" rx="22" fill="#7c3aed"/>
    <text x="800" y="684" fill="#ede9fe" font-size="18" font-weight="750" text-anchor="middle">SCALED COMPATIBILITY</text>
    <text x="800" y="722" fill="#ffffff" font-size="28" font-family="Georgia, serif" font-style="italic" text-anchor="middle">uf,i = qfᵀkf,i / √r</text>

    <path d="M 1035 697 H 1096" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="1070" y="170" width="470" height="8" rx="4" fill="#0d9488"/>
    <text x="1106" y="226" fill="#0d9488" font-size="18" font-weight="750" letter-spacing="1.8">3 · NORMALIZE AND RETURN</text>
    <text x="1106" y="266" fill="#0f172a" font-size="30" font-weight="700">Utilities become probabilities</text>
    <text x="1106" y="300" fill="#64748b" font-size="20">One softmax per question</text>

    <g>
      <rect x="1110" y="348" width="96" height="62" rx="18" fill="#eff6ff"/>
      <rect x="1222" y="348" width="96" height="62" rx="18" fill="#f5f3ff"/>
      <rect x="1334" y="348" width="96" height="62" rx="18" fill="#f0fdfa"/>
      <text x="1158" y="387" fill="#1e40af" font-size="25" font-family="Georgia, serif" font-style="italic" text-anchor="middle">u₁</text>
      <text x="1270" y="387" fill="#6d28d9" font-size="25" font-family="Georgia, serif" font-style="italic" text-anchor="middle">u₂</text>
      <text x="1382" y="387" fill="#0f766e" font-size="25" font-family="Georgia, serif" font-style="italic" text-anchor="middle">uₖ</text>
      <text x="1456" y="387" fill="#94a3b8" font-size="26" font-weight="700">…</text>
    </g>

    <path d="M 1305 424 V 468" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="1193" y="482" width="224" height="76" rx="24" fill="url(#probability)"/>
    <text x="1305" y="513" fill="#ccfbf1" font-size="17" font-weight="750" text-anchor="middle">PLACKETT–LUCE</text>
    <text x="1305" y="542" fill="#ffffff" font-size="25" font-weight="750" text-anchor="middle">SOFTMAX</text>

    <rect x="1110" y="606" width="390" height="72" rx="20" fill="#e2e8f0"/>
    <rect x="1110" y="606" width="176" height="72" rx="20" fill="#2563eb"/>
    <rect x="1286" y="606" width="116" height="72" fill="#8b5cf6"/>
    <rect x="1402" y="606" width="98" height="72" rx="20" fill="#5eead4"/>
    <text x="1198" y="650" fill="#ffffff" font-size="24" font-weight="750" text-anchor="middle">p₁</text>
    <text x="1344" y="650" fill="#ffffff" font-size="24" font-weight="750" text-anchor="middle">p₂</text>
    <text x="1451" y="650" fill="#115e59" font-size="24" font-weight="750" text-anchor="middle">pₖ</text>

    <rect x="1110" y="706" width="118" height="50" rx="16" fill="#eff6ff"/>
    <rect x="1240" y="706" width="118" height="50" rx="16" fill="#f5f3ff"/>
    <rect x="1370" y="706" width="130" height="50" rx="16" fill="#f0fdfa"/>
    <text x="1169" y="738" fill="#1e40af" font-size="20" font-weight="750" text-anchor="middle">Noul</text>
    <text x="1299" y="738" fill="#6d28d9" font-size="20" font-weight="750" text-anchor="middle">Choice</text>
    <text x="1435" y="738" fill="#0f766e" font-size="20" font-weight="750" text-anchor="middle">Score</text>

    <rect x="170" y="828" width="1260" height="66" rx="33" fill="url(#takeaway)"/>
    <text x="800" y="870" fill="#ffffff" font-size="25" font-weight="750" text-anchor="middle">new candidate text → shared head → utility → calibrated typed decision</text>
  </g>
</svg>
