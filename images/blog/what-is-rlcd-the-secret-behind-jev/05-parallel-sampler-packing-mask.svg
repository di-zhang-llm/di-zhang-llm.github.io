<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Tree attention turns a packed buffer into isolated candidate branches</title>
  <desc id="desc">A state branches into two questions and four candidates. Beside it, an attention matrix shows that every candidate can read the shared state, its own question, and itself, while sibling candidates and other questions remain masked.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <pattern id="masked" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#f8fafc"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#d7dee8" stroke-width="4"/>
    </pattern>
    <linearGradient id="takeaway" x1="0" x2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="980" fill="#f8fafc"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="70" y="76" fill="#0f172a" font-size="50" font-weight="750">The packed sequence is logically a tree</text>
    <text x="72" y="120" fill="#475569" font-size="24">state → question → candidate · one buffer, branch-isolated attention</text>

    <g filter="url(#shadow)">
      <rect x="60" y="164" width="710" height="668" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="800" y="164" width="740" height="668" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    </g>

    <text x="100" y="216" fill="#2563eb" font-size="19" font-weight="750" letter-spacing="1.8">LOGICAL COMPUTATION</text>
    <text x="100" y="255" fill="#0f172a" font-size="29" font-weight="700">Shared prefixes, isolated leaves</text>

    <path d="M 415 342 C 415 380 255 374 255 420" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M 415 342 C 415 380 575 374 575 420" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M 255 496 C 255 535 165 535 165 580" fill="none" stroke="#8b5cf6" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M 255 496 C 255 535 345 535 345 580" fill="none" stroke="#8b5cf6" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M 575 496 C 575 535 485 535 485 580" fill="none" stroke="#0d9488" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M 575 496 C 575 535 665 535 665 580" fill="none" stroke="#0d9488" stroke-width="4" marker-end="url(#arrow)"/>

    <g>
      <rect x="298" y="280" width="234" height="64" rx="20" fill="#dbeafe" stroke="#60a5fa" stroke-width="2.5"/>
      <text x="415" y="320" fill="#1e3a8a" font-size="24" font-weight="750" text-anchor="middle">STATE S</text>

      <rect x="155" y="422" width="200" height="74" rx="20" fill="#ede9fe" stroke="#a78bfa" stroke-width="2.5"/>
      <text x="255" y="452" fill="#5b21b6" font-size="18" font-weight="700" text-anchor="middle">QUESTION</text>
      <text x="255" y="480" fill="#5b21b6" font-size="25" font-weight="750" text-anchor="middle">Q1</text>

      <rect x="475" y="422" width="200" height="74" rx="20" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="2.5"/>
      <text x="575" y="452" fill="#0f766e" font-size="18" font-weight="700" text-anchor="middle">QUESTION</text>
      <text x="575" y="480" fill="#0f766e" font-size="25" font-weight="750" text-anchor="middle">Q2</text>

      <rect x="95" y="582" width="140" height="72" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2.5"/>
      <rect x="275" y="582" width="140" height="72" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2.5"/>
      <rect x="415" y="582" width="140" height="72" rx="18" fill="#f0fdfa" stroke="#5eead4" stroke-width="2.5"/>
      <rect x="595" y="582" width="140" height="72" rx="18" fill="#f0fdfa" stroke="#5eead4" stroke-width="2.5"/>
      <text x="165" y="627" fill="#6d28d9" font-size="23" font-weight="750" text-anchor="middle">C11</text>
      <text x="345" y="627" fill="#6d28d9" font-size="23" font-weight="750" text-anchor="middle">C12</text>
      <text x="485" y="627" fill="#0f766e" font-size="23" font-weight="750" text-anchor="middle">C21</text>
      <text x="665" y="627" fill="#0f766e" font-size="23" font-weight="750" text-anchor="middle">C22</text>
    </g>

    <g>
      <rect x="100" y="704" width="630" height="88" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
      <circle cx="132" cy="736" r="9" fill="#2563eb"/>
      <text x="154" y="743" fill="#334155" font-size="20">Q1 and Q2 reuse the same state representation.</text>
      <circle cx="132" cy="770" r="9" fill="#0f766e"/>
      <text x="154" y="777" fill="#334155" font-size="20">C11 and C12 share Q1, but cannot see each other.</text>
    </g>

    <text x="840" y="216" fill="#0f766e" font-size="19" font-weight="750" letter-spacing="1.8">TREE ATTENTION MASK</text>
    <text x="840" y="255" fill="#0f172a" font-size="29" font-weight="700">Rows read only their ancestral path</text>
    <text x="840" y="286" fill="#64748b" font-size="18">query rows ↓ · key/value columns →</text>

    <g transform="translate(892 330)">
      <g fill="#475569" font-size="16" font-weight="750" text-anchor="middle">
        <text x="34" y="-15">S</text><text x="100" y="-15">Q1</text><text x="166" y="-15">C11</text><text x="232" y="-15">C12</text><text x="298" y="-15">Q2</text><text x="364" y="-15">C21</text><text x="430" y="-15">C22</text>
      </g>
      <g fill="#475569" font-size="16" font-weight="750" text-anchor="end">
        <text x="-15" y="41">S</text><text x="-15" y="107">Q1</text><text x="-15" y="173">C11</text><text x="-15" y="239">C12</text><text x="-15" y="305">Q2</text><text x="-15" y="371">C21</text><text x="-15" y="437">C22</text>
      </g>

      <rect x="0" y="0" width="462" height="462" rx="14" fill="url(#masked)" stroke="#cbd5e1" stroke-width="2"/>

      <rect x="0" y="0" width="66" height="66" fill="#93c5fd"/>
      <rect x="0" y="66" width="66" height="66" fill="#93c5fd"/><rect x="66" y="66" width="66" height="66" fill="#c4b5fd"/>
      <rect x="0" y="132" width="66" height="66" fill="#93c5fd"/><rect x="66" y="132" width="66" height="66" fill="#c4b5fd"/><rect x="132" y="132" width="66" height="66" fill="#ddd6fe"/>
      <rect x="0" y="198" width="66" height="66" fill="#93c5fd"/><rect x="66" y="198" width="66" height="66" fill="#c4b5fd"/><rect x="198" y="198" width="66" height="66" fill="#ddd6fe"/>
      <rect x="0" y="264" width="66" height="66" fill="#93c5fd"/><rect x="264" y="264" width="66" height="66" fill="#5eead4"/>
      <rect x="0" y="330" width="66" height="66" fill="#93c5fd"/><rect x="264" y="330" width="66" height="66" fill="#5eead4"/><rect x="330" y="330" width="66" height="66" fill="#99f6e4"/>
      <rect x="0" y="396" width="66" height="66" fill="#93c5fd"/><rect x="264" y="396" width="66" height="66" fill="#5eead4"/><rect x="396" y="396" width="66" height="66" fill="#99f6e4"/>

      <g stroke="#ffffff" stroke-width="2.5">
        <path d="M66 0V462M132 0V462M198 0V462M264 0V462M330 0V462M396 0V462"/>
        <path d="M0 66H462M0 132H462M0 198H462M0 264H462M0 330H462M0 396H462"/>
      </g>
    </g>

    <g transform="translate(1388 343)">
      <rect x="0" y="0" width="112" height="302" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
      <text x="56" y="34" fill="#64748b" font-size="14" font-weight="750" text-anchor="middle" letter-spacing="1">VISIBLE</text>
      <rect x="20" y="54" width="28" height="28" rx="6" fill="#93c5fd"/><text x="58" y="74" fill="#334155" font-size="14">state</text>
      <rect x="20" y="96" width="28" height="28" rx="6" fill="#c4b5fd"/><text x="58" y="116" fill="#334155" font-size="14">Q1</text>
      <rect x="20" y="138" width="28" height="28" rx="6" fill="#5eead4"/><text x="58" y="158" fill="#334155" font-size="14">Q2</text>
      <rect x="20" y="180" width="28" height="28" rx="6" fill="#ddd6fe"/><text x="58" y="200" fill="#334155" font-size="14">leaf</text>
      <line x1="16" y1="228" x2="96" y2="228" stroke="#e2e8f0" stroke-width="2"/>
      <rect x="20" y="246" width="28" height="28" rx="6" fill="url(#masked)" stroke="#cbd5e1"/><text x="58" y="266" fill="#64748b" font-size="14">masked</text>
    </g>

    <rect x="176" y="864" width="1248" height="78" rx="39" fill="url(#takeaway)"/>
    <text x="800" y="895" fill="#bfdbfe" font-size="17" font-weight="750" letter-spacing="2" text-anchor="middle">ONE FORWARD PASS</text>
    <text x="800" y="926" fill="#ffffff" font-size="25" font-weight="750" text-anchor="middle">physical packing + tree mask + branch-local positions</text>
  </g>
</svg>
