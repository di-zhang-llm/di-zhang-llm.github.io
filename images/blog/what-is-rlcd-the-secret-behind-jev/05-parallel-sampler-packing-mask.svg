<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">The parallel sampler is packing plus masking</title>
  <desc id="desc">A diagram showing repeated state across separate calls transformed into one packed sequence. A block attention matrix lets three question blocks read the shared state while preventing cross-question attention, producing three typed probability outputs in one forward pass.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <pattern id="masked" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#f8fafc"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#cbd5e1" stroke-width="4"/>
    </pattern>
    <linearGradient id="forward" x1="0" x2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="980" fill="#f8fafc"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="80" y="78" fill="#0f172a" font-size="50" font-weight="700">The “parallel sampler” is packing + masking</text>
    <text x="82" y="124" fill="#475569" font-size="25">One shared state · isolated question blocks · one forward pass</text>

    <g filter="url(#shadow)">
      <rect x="70" y="172" width="410" height="628" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    </g>
    <text x="110" y="226" fill="#64748b" font-size="20" font-weight="700" letter-spacing="1.8">WITHOUT PACKING</text>
    <text x="110" y="265" fill="#0f172a" font-size="29" font-weight="700">Repeat the same state</text>

    <g>
      <rect x="110" y="316" width="134" height="72" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
      <rect x="254" y="316" width="170" height="72" rx="18" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
      <text x="177" y="360" text-anchor="middle" fill="#1e3a8a" font-size="24" font-weight="700">STATE</text>
      <text x="339" y="360" text-anchor="middle" fill="#5b21b6" font-size="24" font-weight="700">Q1 + options</text>

      <rect x="110" y="424" width="134" height="72" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
      <rect x="254" y="424" width="170" height="72" rx="18" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="2"/>
      <text x="177" y="468" text-anchor="middle" fill="#1e3a8a" font-size="24" font-weight="700">STATE</text>
      <text x="339" y="468" text-anchor="middle" fill="#0f766e" font-size="24" font-weight="700">Q2 + options</text>

      <rect x="110" y="532" width="134" height="72" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
      <rect x="254" y="532" width="170" height="72" rx="18" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/>
      <text x="177" y="576" text-anchor="middle" fill="#1e3a8a" font-size="24" font-weight="700">STATE</text>
      <text x="339" y="576" text-anchor="middle" fill="#9a3412" font-size="24" font-weight="700">Q3 + options</text>
    </g>
    <text x="110" y="660" fill="#475569" font-size="22">Three calls repeat the long prefix</text>
    <text x="110" y="695" fill="#475569" font-size="22">and leave more padding overhead.</text>
    <rect x="110" y="728" width="324" height="44" rx="22" fill="#f1f5f9"/>
    <text x="272" y="757" fill="#64748b" font-size="20" font-weight="700" text-anchor="middle">3 requests · 3 model passes</text>

    <path d="M 500 486 H 560" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-blue)"/>
    <text x="530" y="452" fill="#2563eb" font-size="19" font-weight="700" text-anchor="middle">PACK</text>

    <g filter="url(#shadow)">
      <rect x="580" y="172" width="950" height="660" rx="28" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    </g>
    <text x="620" y="226" fill="#2563eb" font-size="20" font-weight="700" letter-spacing="1.8">ONE PACKED FORWARD PASS</text>

    <text x="620" y="272" fill="#0f172a" font-size="27" font-weight="700">1 · Concatenate segments</text>
    <g>
      <rect x="620" y="298" width="214" height="70" rx="17" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
      <rect x="842" y="298" width="196" height="70" rx="17" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
      <rect x="1046" y="298" width="196" height="70" rx="17" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="2"/>
      <rect x="1250" y="298" width="196" height="70" rx="17" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/>
      <text x="727" y="341" fill="#1e3a8a" font-size="23" font-weight="700" text-anchor="middle">SHARED STATE</text>
      <text x="940" y="341" fill="#5b21b6" font-size="22" font-weight="700" text-anchor="middle">Q1 + options</text>
      <text x="1144" y="341" fill="#0f766e" font-size="22" font-weight="700" text-anchor="middle">Q2 + options</text>
      <text x="1348" y="341" fill="#9a3412" font-size="22" font-weight="700" text-anchor="middle">Q3 + options</text>
    </g>

    <text x="620" y="425" fill="#0f172a" font-size="27" font-weight="700">2 · Apply a block attention mask</text>
    <text x="620" y="458" fill="#64748b" font-size="19">Rows attend to columns</text>

    <g transform="translate(620 480)">
      <text x="112" y="-12" fill="#1e3a8a" font-size="18" font-weight="700" text-anchor="middle">S</text>
      <text x="196" y="-12" fill="#5b21b6" font-size="18" font-weight="700" text-anchor="middle">Q1</text>
      <text x="280" y="-12" fill="#0f766e" font-size="18" font-weight="700" text-anchor="middle">Q2</text>
      <text x="364" y="-12" fill="#9a3412" font-size="18" font-weight="700" text-anchor="middle">Q3</text>

      <text x="45" y="56" fill="#1e3a8a" font-size="18" font-weight="700" text-anchor="middle">S</text>
      <text x="45" y="140" fill="#5b21b6" font-size="18" font-weight="700" text-anchor="middle">Q1</text>
      <text x="45" y="224" fill="#0f766e" font-size="18" font-weight="700" text-anchor="middle">Q2</text>
      <text x="45" y="308" fill="#9a3412" font-size="18" font-weight="700" text-anchor="middle">Q3</text>

      <rect x="70" y="10" width="336" height="336" rx="12" fill="url(#masked)" stroke="#cbd5e1" stroke-width="2"/>

      <rect x="70" y="10" width="84" height="84" fill="#93c5fd"/>
      <rect x="70" y="94" width="84" height="84" fill="#93c5fd"/>
      <rect x="154" y="94" width="84" height="84" fill="#c4b5fd"/>
      <rect x="70" y="178" width="84" height="84" fill="#93c5fd"/>
      <rect x="238" y="178" width="84" height="84" fill="#5eead4"/>
      <rect x="70" y="262" width="84" height="84" fill="#93c5fd"/>
      <rect x="322" y="262" width="84" height="84" fill="#fdba74"/>

      <path d="M 154 10 V 346 M 238 10 V 346 M 322 10 V 346 M 70 94 H 406 M 70 178 H 406 M 70 262 H 406" stroke="#ffffff" stroke-width="3"/>
    </g>

    <g transform="translate(1065 458)">
      <rect x="0" y="0" width="405" height="364" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <text x="28" y="45" fill="#0f172a" font-size="25" font-weight="700">Mask semantics</text>

      <rect x="28" y="76" width="28" height="28" rx="6" fill="#93c5fd"/>
      <text x="72" y="98" fill="#334155" font-size="20">read shared state</text>
      <rect x="28" y="122" width="28" height="28" rx="6" fill="#c4b5fd"/>
      <text x="72" y="144" fill="#334155" font-size="20">read own question block</text>
      <rect x="28" y="168" width="28" height="28" rx="6" fill="url(#masked)" stroke="#cbd5e1"/>
      <text x="72" y="190" fill="#334155" font-size="20">block other questions</text>

      <line x1="28" y1="224" x2="377" y2="224" stroke="#e2e8f0" stroke-width="2"/>
      <text x="28" y="265" fill="#64748b" font-size="18" font-weight="700" letter-spacing="1.2">OUTPUTS, TOGETHER</text>
      <rect x="28" y="286" width="104" height="50" rx="15" fill="#ede9fe"/>
      <rect x="150" y="286" width="104" height="50" rx="15" fill="#ccfbf1"/>
      <rect x="272" y="286" width="104" height="50" rx="15" fill="#ffedd5"/>
      <text x="80" y="318" fill="#5b21b6" font-size="19" font-weight="700" text-anchor="middle">P(A₁)</text>
      <text x="202" y="318" fill="#0f766e" font-size="19" font-weight="700" text-anchor="middle">P(A₂)</text>
      <text x="324" y="318" fill="#9a3412" font-size="19" font-weight="700" text-anchor="middle">P(A₃)</text>
    </g>

    <rect x="180" y="852" width="1240" height="76" rx="38" fill="url(#forward)"/>
    <text x="800" y="881" fill="#bfdbfe" font-size="18" font-weight="700" letter-spacing="2" text-anchor="middle">STANDARD TRANSFORMER PRIMITIVES</text>
    <text x="800" y="913" fill="#ffffff" font-size="27" font-weight="700" text-anchor="middle">packing + attention mask + typed decision heads</text>
  </g>
</svg>
